<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Throwaway mobile UI prototype for Book Title Lookup"
    >
    <title>Book Title Lookup — Mobile prototype</title>
    <style>
    :root {
      color-scheme: light;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-synthesis: none;
      --switcher-height: 52px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: #dfe4e8;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #f29f05;
      outline-offset: 2px;
    }

    .phone-shell {
      position: relative;
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      overflow: hidden;
      box-shadow: 0 0 54px rgb(31 42 47 / 18%);
    }

    .prototype-note {
      position: fixed;
      z-index: 100;
      top: 12px;
      left: 50%;
      max-width: calc(100vw - 24px);
      padding: 7px 12px;
      border: 1px solid rgb(255 255 255 / 22%);
      border-radius: 999px;
      background: rgb(16 22 25 / 88%);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transform: translateX(-50%);
      backdrop-filter: blur(12px);
    }

    .prototype-switcher {
      position: fixed;
      z-index: 100;
      right: 50%;
      bottom: 14px;
      display: grid;
      grid-template-columns: 42px minmax(158px, auto) 42px;
      min-height: var(--switcher-height);
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 18px;
      background: rgb(14 20 23 / 94%);
      box-shadow: 0 14px 36px rgb(0 0 0 / 28%);
      color: #fff;
      transform: translateX(50%);
      backdrop-filter: blur(16px);
    }

    .prototype-switcher button {
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 20px;
    }

    .prototype-switcher button:hover {
      background: rgb(255 255 255 / 10%);
    }

    .variant-label {
      align-self: center;
      padding: 0 10px;
      border-right: 1px solid rgb(255 255 255 / 12%);
      border-left: 1px solid rgb(255 255 255 / 12%);
      text-align: center;
    }

    .variant-label strong,
    .variant-label small {
      display: block;
    }

    .variant-label strong {
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .variant-label small {
      margin-top: 2px;
      color: #aebbc0;
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Variant A: a warm, explicit step-by-step path. */
    .variant-a {
      min-height: 100vh;
      padding: 74px 20px 100px;
      background:
        radial-gradient(circle at 100% 0, #ffe5a4 0, transparent 28%),
        #f7f2e8;
      color: #252b28;
    }

    .a-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .a-wordmark {
      display: flex;
      gap: 10px;
      align-items: center;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      font-weight: 700;
    }

    .a-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 50%;
      background: #d5593f;
      color: #fff;
      font-family: sans-serif;
      font-size: 17px;
    }

    .a-language {
      border: 1px solid #d8d0c2;
      border-radius: 999px;
      background: rgb(255 255 255 / 55%);
      color: #5b625e;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .a-kicker {
      margin: 0 0 8px;
      color: #9c4936;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .variant-a h1 {
      max-width: 330px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 10vw, 43px);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    .a-intro {
      margin: 14px 0 25px;
      color: #656a66;
      font-size: 14px;
      line-height: 1.5;
    }

    .a-search {
      display: grid;
      grid-template-columns: 1fr 46px;
      gap: 8px;
      padding: 7px;
      border: 1px solid #dcd4c7;
      border-radius: 17px;
      background: #fffdf8;
      box-shadow: 0 9px 25px rgb(76 64 45 / 8%);
    }

    .a-search input {
      min-width: 0;
      border: 0;
      background: transparent;
      padding: 0 9px;
      color: #252b28;
      font-size: 15px;
    }

    .a-search button {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: #263c35;
      color: #fff;
      font-size: 18px;
    }

    .a-step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      margin-top: 32px;
    }

    .a-step-number {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid #d0c7b8;
      border-radius: 50%;
      color: #81796d;
      font-family: Georgia, serif;
      font-size: 13px;
    }

    .a-step-number.active {
      border-color: #d5593f;
      background: #d5593f;
      color: #fff;
    }

    .a-step-number.done {
      border-color: #263c35;
      background: #263c35;
      color: #fff;
    }

    .a-step-copy h2 {
      margin: 3px 0 3px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
    }

    .a-step-copy > p {
      margin: 0;
      color: #747973;
      font-size: 12px;
      line-height: 1.45;
    }

    .a-candidates {
      display: grid;
      gap: 12px;
      margin-top: 17px;
    }

    .a-candidate {
      width: 100%;
      padding: 17px;
      border: 1px solid #ddd4c5;
      border-radius: 18px;
      background: rgb(255 253 248 / 82%);
      color: inherit;
      text-align: left;
      transition:
        border-color 160ms ease,
        transform 160ms ease,
        box-shadow 160ms ease;
    }

    .a-candidate:hover {
      border-color: #d5593f;
      box-shadow: 0 12px 25px rgb(76 64 45 / 9%);
      transform: translateY(-2px);
    }

    .a-candidate-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .a-candidate h3 {
      margin: 0 0 5px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
    }

    .a-arrow {
      color: #d5593f;
      font-size: 20px;
    }

    .a-candidate p,
    .a-candidate dl {
      color: #666d68;
      font-size: 12px;
    }

    .a-candidate p {
      margin: 0;
    }

    .a-candidate dl {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 6px 12px;
      margin: 15px 0 0;
      padding-top: 13px;
      border-top: 1px solid #eee7dc;
    }

    .a-candidate dt {
      color: #999185;
    }

    .a-candidate dd {
      margin: 0;
      color: #3f4642;
      font-weight: 700;
    }

    .a-back,
    .c-back {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 12px;
      font-weight: 800;
    }

    .a-resolved {
      margin-top: 16px;
      padding: 16px;
      border-radius: 18px;
      background: #263c35;
      color: #fff;
    }

    .a-resolved small {
      color: #b9c9c3;
    }

    .a-resolved h3 {
      margin: 5px 0 3px;
      font-family: Georgia, serif;
      font-size: 21px;
    }

    .a-resolved p {
      margin: 0;
      color: #d8e0dc;
      font-size: 12px;
    }

    .a-results {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .a-result {
      padding: 16px;
      border: 1px solid #ddd4c5;
      border-radius: 16px;
      background: #fffdf8;
    }

    .a-result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .a-result-lang,
    .evidence-badge {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .a-result-lang {
      color: #8c8276;
    }

    .evidence-badge {
      padding: 5px 7px;
      border-radius: 999px;
      background: #e5efe7;
      color: #386147;
    }

    .evidence-badge.probable {
      background: #fff0cf;
      color: #85601b;
    }

    .a-result h3 {
      margin: 12px 0 8px;
      font-family: Georgia, serif;
      font-size: 22px;
      font-weight: 500;
    }

    .a-evidence-link {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 0;
      border: 0;
      background: transparent;
      color: #9c4936;
      font-size: 11px;
      font-weight: 800;
    }

    /* Variant B: a focused, one-decision-at-a-time deck. */
    .variant-b {
      min-height: 100vh;
      padding: 70px 18px 112px;
      background:
        linear-gradient(rgb(255 255 255 / 3%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / 3%) 1px, transparent 1px),
        #0e1e2b;
      background-size: 24px 24px;
      color: #f5f6f4;
    }

    .b-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .b-logo {
      display: flex;
      gap: 9px;
      align-items: center;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .b-logo-mark {
      width: 12px;
      height: 18px;
      border-radius: 2px 7px 7px 2px;
      background: #c8ff59;
      box-shadow: 5px 0 0 rgb(200 255 89 / 32%);
    }

    .b-progress {
      color: #81909b;
      font-size: 11px;
      font-weight: 800;
    }

    .b-search {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 25px;
      padding: 5px 5px 5px 13px;
      border: 1px solid #2e4352;
      border-radius: 13px;
      background: #132836;
    }

    .b-search span {
      color: #718896;
    }

    .b-search input {
      min-width: 0;
      flex: 1;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 14px;
    }

    .b-search button {
      padding: 9px 12px;
      border: 0;
      border-radius: 9px;
      background: #c8ff59;
      color: #10202b;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .b-kicker {
      margin: 0 0 7px;
      color: #c8ff59;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .variant-b h1 {
      margin: 0;
      font-size: 29px;
      letter-spacing: -0.04em;
      line-height: 1.08;
    }

    .b-intro {
      margin: 11px 0 22px;
      color: #9eabb4;
      font-size: 13px;
      line-height: 1.48;
    }

    .b-deck {
      position: relative;
    }

    .b-deck::before,
    .b-deck::after {
      position: absolute;
      right: 10px;
      bottom: -8px;
      left: 10px;
      height: 28px;
      border: 1px solid #29404f;
      border-radius: 20px;
      background: #132735;
      content: "";
    }

    .b-deck::after {
      right: 5px;
      bottom: -4px;
      left: 5px;
      background: #182f3e;
    }

    .b-card {
      position: relative;
      z-index: 1;
      min-height: 360px;
      padding: 23px;
      border: 1px solid #365062;
      border-radius: 23px;
      background:
        radial-gradient(circle at 100% 0, rgb(200 255 89 / 11%), transparent 31%),
        #193140;
      box-shadow: 0 24px 60px rgb(0 0 0 / 23%);
    }

    .b-count {
      color: #8095a2;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
    }

    .b-card h2 {
      max-width: 290px;
      margin: 33px 0 9px;
      font-size: 30px;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .b-byline {
      margin: 0;
      color: #bec9ce;
      font-size: 14px;
    }

    .b-facts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 28px 0 24px;
    }

    .b-fact {
      padding: 12px;
      border: 1px solid #365061;
      border-radius: 12px;
      background: rgb(8 28 41 / 32%);
    }

    .b-fact small,
    .b-fact strong {
      display: block;
    }

    .b-fact small {
      margin-bottom: 5px;
      color: #748c9a;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .b-fact strong {
      font-size: 12px;
      line-height: 1.35;
    }

    .b-primary {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      background: #c8ff59;
      color: #10202b;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .b-deck-controls {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 24px;
    }

    .b-deck-controls button {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 1px solid #334958;
      border-radius: 50%;
      background: #132735;
      color: #fff;
    }

    .b-dots {
      display: flex;
      gap: 6px;
    }

    .b-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #475c69;
    }

    .b-dot.active {
      width: 17px;
      border-radius: 999px;
      background: #c8ff59;
    }

    .b-resolved-head {
      padding: 18px;
      border: 1px solid #355063;
      border-radius: 18px;
      background: #193140;
    }

    .b-back {
      margin-bottom: 16px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #c8ff59;
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .b-resolved-head small {
      color: #8196a3;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .b-resolved-head h2 {
      margin: 7px 0 6px;
      font-size: 25px;
    }

    .b-resolved-head p {
      margin: 0;
      color: #aebbc2;
      font-size: 12px;
    }

    .b-timeline {
      position: relative;
      display: grid;
      gap: 14px;
      margin: 24px 0 0 10px;
      padding-left: 24px;
    }

    .b-timeline::before {
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 4px;
      width: 1px;
      background: #38505e;
      content: "";
    }

    .b-result {
      position: relative;
      padding: 17px;
      border: 1px solid #2f4757;
      border-radius: 16px;
      background: #132735;
    }

    .b-result::before {
      position: absolute;
      top: 22px;
      left: -25px;
      width: 9px;
      height: 9px;
      border: 3px solid #0e1e2b;
      border-radius: 50%;
      background: #c8ff59;
      content: "";
    }

    .b-result small {
      color: #7f95a2;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .b-result h3 {
      margin: 8px 0 10px;
      font-size: 19px;
    }

    .b-source {
      color: #a8b6bd;
      font-size: 11px;
    }

    .b-source strong {
      color: #d9e2e5;
    }

    /* Variant C: a compact evidence-oriented comparison surface. */
    .variant-c {
      min-height: 100vh;
      padding: 68px 0 100px;
      background: #f2f6f7;
      color: #162c35;
    }

    .c-header {
      padding: 0 18px 20px;
      border-bottom: 1px solid #d9e4e7;
    }

    .c-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .c-brand {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .c-brand-icon {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 8px;
      background: #127a75;
      color: #fff;
      font-size: 14px;
    }

    .c-help {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 1px solid #cddadd;
      border-radius: 50%;
      background: #fff;
      color: #60757c;
      font-size: 12px;
      font-weight: 900;
    }

    .c-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 7px;
    }

    .c-search-wrap {
      position: relative;
    }

    .c-search-wrap span {
      position: absolute;
      top: 50%;
      left: 12px;
      color: #71868d;
      transform: translateY(-50%);
    }

    .c-search input {
      width: 100%;
      height: 44px;
      border: 1px solid #c9d7db;
      border-radius: 10px;
      background: #fff;
      padding: 0 12px 0 36px;
      color: #162c35;
      font-size: 14px;
    }

    .c-search button {
      border: 0;
      border-radius: 10px;
      background: #127a75;
      color: #fff;
      padding: 0 15px;
      font-size: 11px;
      font-weight: 900;
    }

    .c-main {
      padding: 22px 18px 0;
    }

    .c-progress {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 24px;
    }

    .c-progress span {
      height: 4px;
      border-radius: 999px;
      background: #d2dfe2;
    }

    .c-progress span.active,
    .c-progress span.done {
      background: #127a75;
    }

    .c-eyebrow {
      margin: 0 0 7px;
      color: #127a75;
      font-size: 10px;
      font-weight: 950;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .variant-c h1 {
      margin: 0;
      font-size: 25px;
      letter-spacing: -0.035em;
      line-height: 1.1;
    }

    .c-intro {
      margin: 9px 0 18px;
      color: #6f8187;
      font-size: 12px;
      line-height: 1.45;
    }

    .c-filter-row {
      display: flex;
      gap: 7px;
      margin-bottom: 13px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .c-filter {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid #ccdadd;
      border-radius: 999px;
      background: #fff;
      color: #60747b;
      font-size: 10px;
      font-weight: 800;
    }

    .c-filter.active {
      border-color: #127a75;
      background: #e3f3f1;
      color: #126c67;
    }

    .c-candidates {
      overflow: hidden;
      border: 1px solid #cedcdf;
      border-radius: 15px;
      background: #fff;
    }

    .c-candidate {
      display: grid;
      grid-template-columns: 34px 1fr 20px;
      gap: 11px;
      align-items: start;
      width: 100%;
      padding: 16px 13px;
      border: 0;
      border-bottom: 1px solid #e1e9eb;
      background: #fff;
      color: inherit;
      text-align: left;
    }

    .c-candidate:last-child {
      border-bottom: 0;
    }

    .c-candidate:hover {
      background: #f5fbfa;
    }

    .c-index {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 9px;
      background: #e3f3f1;
      color: #127a75;
      font-size: 11px;
      font-weight: 950;
    }

    .c-candidate h2 {
      margin: 0 0 4px;
      font-size: 15px;
    }

    .c-candidate p {
      margin: 0;
      color: #697d84;
      font-size: 11px;
      line-height: 1.45;
    }

    .c-candidate strong {
      color: #334b54;
    }

    .c-chevron {
      margin-top: 6px;
      color: #82969c;
    }

    .c-note {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 13px;
      padding: 11px;
      border-radius: 10px;
      background: #e8f0f2;
      color: #597077;
      font-size: 10px;
      line-height: 1.45;
    }

    .c-resolved {
      display: grid;
      grid-template-columns: 37px 1fr;
      gap: 11px;
      margin: 16px 0 20px;
      padding: 14px;
      border: 1px solid #bfd8d5;
      border-radius: 13px;
      background: #e3f3f1;
    }

    .c-check {
      display: grid;
      width: 37px;
      height: 37px;
      place-items: center;
      border-radius: 50%;
      background: #127a75;
      color: #fff;
    }

    .c-resolved small {
      color: #5d7b7d;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .c-resolved h2 {
      margin: 3px 0;
      font-size: 16px;
    }

    .c-resolved p {
      margin: 0;
      color: #527075;
      font-size: 10px;
    }

    .c-language-row {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 15px 0;
      border-bottom: 1px solid #dce6e8;
    }

    .c-lang-code {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid #cbdadd;
      border-radius: 11px;
      background: #fff;
      color: #64787f;
      font-size: 10px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .c-language-row h3 {
      margin: 0 0 4px;
      font-size: 15px;
    }

    .c-language-row p {
      margin: 0;
      color: #72858b;
      font-size: 10px;
    }

    .c-level {
      color: #127a75;
      font-size: 9px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .c-level.probable {
      color: #9a6c16;
    }

    @media (min-width: 700px) {
      body {
        padding: 28px 0;
      }

      .phone-shell {
        min-height: calc(100vh - 56px);
        border-radius: 30px;
      }

      .variant-a,
      .variant-b,
      .variant-c {
        min-height: calc(100vh - 56px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
    </style>
  </head>
  <body>
    <!--
      THROWAWAY PROTOTYPE:
      Three mobile lookup variants, switchable via ?variant=A|B|C, on the
      standalone /apps/mobile-prototype route.
    -->
    <div class="prototype-note">Throwaway mobile prototype</div>
    <main id="app" class="phone-shell"></main>
    <nav class="prototype-switcher" aria-label="Prototype variants">
      <button id="previous-variant" type="button" aria-label="Previous variant">
        ←
      </button>
      <div class="variant-label" aria-live="polite">
        <strong id="variant-name"></strong>
        <small>Use ← → keys</small>
      </div>
      <button id="next-variant" type="button"
        aria-label="Next variant">→</button>
    </nav>

    <script>
    const candidates = [
      {
        title: "One Hundred Years of Solitude",
        author: "Gabriel García Márquez",
        year: "1967",
        original: "Cien años de soledad",
        type: "Novel",
        note: "A multi-generational novel set in the fictional town of Macondo.",
      },
      {
        title: "The Secret History of One Hundred Years of Solitude",
        author: "Álvaro Santana-Acuña",
        year: "2020",
        original: "Ascent to Glory",
        type: "Literary history",
        note: "A history of how García Márquez's novel became a global classic.",
      },
      {
        title: "Cien años de soledad: una interpretación",
        author: "Josefina Ludmer",
        year: "1972",
        original: "Cien años de soledad: una interpretación",
        type: "Literary criticism",
        note: "A critical study of the novel, rather than the novel itself.",
      },
    ];

    const titles = [
      {
        language: "English",
        code: "EN",
        title: "One Hundred Years of Solitude",
        level: "Verified",
        source: "Harper Perennial Modern Classics, 2006",
        detail: "Edition ISBN 978-0-06-088328-7",
      },
      {
        language: "Spanish",
        code: "ES",
        title: "Cien años de soledad",
        level: "Verified",
        source: "Editorial Sudamericana, 1967",
        detail: "Original edition record",
      },
      {
        language: "French",
        code: "FR",
        title: "Cent ans de solitude",
        level: "Verified",
        source: "Éditions du Seuil, 1968",
        detail: "Edition ISBN 978-2-02-023811-3",
      },
      {
        language: "Japanese",
        code: "JA",
        title: "百年の孤独",
        level: "Probable",
        source: "Multiple consistent catalog records",
        detail: "No direct Work–Edition relation",
      },
    ];

    const variants = [
      { key: "A", name: "A · Guided path" },
      { key: "B", name: "B · Focus deck" },
      { key: "C", name: "C · Evidence map" },
    ];

    const state = {
      stage: "candidates",
      selectedCandidate: 0,
      deckIndex: 0,
      query: "百年孤独",
    };

    const app = document.querySelector("#app");
    const variantName = document.querySelector("#variant-name");

    function currentVariant() {
      const requested = new URLSearchParams(location.search)
        .get("variant")
        ?.toUpperCase();
      return variants.find((variant) => variant.key === requested) ?? variants[0];
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function searchForm(className) {
      const icon = className === "c-search" ? "<span>⌕</span>" : "";
      const wrapStart = className === "c-search"
        ? '<div class="c-search-wrap">'
        : "";
      const wrapEnd = className === "c-search" ? "</div>" : "";
      const leading = className === "b-search" ? "<span>⌕</span>" : "";
      const label = className === "b-search" ? "Update" : "Search";
      const buttonContent = className === "a-search" ? "→" : label;

      return `
        <form class="${className}" data-action="search">
          ${leading}${wrapStart}${icon}
          <label class="sr-only" for="${className}-input">Book title</label>
          <input
            id="${className}-input"
            name="query"
            value="${escapeHtml(state.query)}"
            autocomplete="off"
            aria-label="Book title"
          >
          ${wrapEnd}
          <button type="submit" aria-label="${label}">${buttonContent}</button>
        </form>
      `;
    }

    function candidateA(candidate, index) {
      return `
        <button
          class="a-candidate"
          type="button"
          data-action="select-candidate"
          data-index="${index}"
        >
          <span class="a-candidate-top">
            <span>
              <h3>${candidate.title}</h3>
              <p>by ${candidate.author}</p>
            </span>
            <span class="a-arrow">↗</span>
          </span>
          <dl>
            <dt>Original title</dt><dd>${candidate.original}</dd>
            <dt>First published</dt><dd>${candidate.year}</dd>
            <dt>Form</dt><dd>${candidate.type}</dd>
          </dl>
        </button>
      `;
    }

    function resultsA() {
      const selected = candidates[state.selectedCandidate];
      return `
        <button class="a-back" type="button" data-action="back">← Change work</button>
        <div class="a-step">
          <span class="a-step-number done">✓</span>
          <div class="a-step-copy">
            <h2>Work confirmed</h2>
            <p>Titles below are tied to this written work, not just similar wording.</p>
            <div class="a-resolved">
              <small>Resolved work</small>
              <h3>${selected.title}</h3>
              <p>${selected.author} · ${selected.year}</p>
            </div>
          </div>
        </div>
        <div class="a-step">
          <span class="a-step-number active">3</span>
          <div class="a-step-copy">
            <h2>Choose a title</h2>
            <p>Recommended published titles, grouped by language.</p>
            <div class="a-results">
              ${
        titles.map((title) => `
                <article class="a-result">
                  <div class="a-result-header">
                    <span class="a-result-lang">${title.language}</span>
                    <span class="evidence-badge ${title.level.toLowerCase()}">
                      ${title.level}
                    </span>
                  </div>
                  <h3>${title.title}</h3>
                  <button
                    class="a-evidence-link"
                    type="button"
                    data-action="toggle-evidence"
                    aria-expanded="false"
                  >
                    <span>＋</span> View publication evidence
                  </button>
                  <p class="evidence-detail" hidden>
                    ${title.source}<br>${title.detail}
                  </p>
                </article>
              `).join("")
      }
            </div>
          </div>
        </div>
      `;
    }

    function renderA() {
      const body = state.stage === "candidates"
        ? `
          <div class="a-step">
            <span class="a-step-number done">✓</span>
            <div class="a-step-copy">
              <h2>Title entered</h2>
              <p>Optional author, ISBN, and year filters would live here.</p>
            </div>
          </div>
          <div class="a-step">
            <span class="a-step-number active">2</span>
            <div class="a-step-copy">
              <h2>Which work is it?</h2>
              <p>Confirm before we look for titles in other languages.</p>
              <div class="a-candidates">
                ${candidates.map(candidateA).join("")}
              </div>
            </div>
          </div>
        `
        : resultsA();

      app.innerHTML = `
        <section class="variant-a">
          <header class="a-brand">
            <div class="a-wordmark">
              <span class="a-mark">文</span>
              <span>Book Titles</span>
            </div>
            <button class="a-language" type="button">EN</button>
          </header>
          <p class="a-kicker">Find the edition, not a translation</p>
          <h1>What was this book called elsewhere?</h1>
          <p class="a-intro">
            Search by the title you know. We’ll trace the same written work
            across published editions.
          </p>
          ${searchForm("a-search")}
          ${body}
        </section>
      `;
    }

    function deckCard() {
      const candidate = candidates[state.deckIndex];
      return `
        <div class="b-deck">
          <article class="b-card">
            <span class="b-count">
              Candidate ${String(state.deckIndex + 1).padStart(2, "0")} /
              ${String(candidates.length).padStart(2, "0")}
            </span>
            <h2>${candidate.title}</h2>
            <p class="b-byline">by ${candidate.author}</p>
            <div class="b-facts">
              <div class="b-fact">
                <small>First published</small>
                <strong>${candidate.year}</strong>
              </div>
              <div class="b-fact">
                <small>Form</small>
                <strong>${candidate.type}</strong>
              </div>
              <div class="b-fact" style="grid-column: 1 / -1">
                <small>Original title</small>
                <strong>${candidate.original}</strong>
              </div>
            </div>
            <button
              class="b-primary"
              type="button"
              data-action="select-candidate"
              data-index="${state.deckIndex}"
            >
              Yes, this is the work
            </button>
          </article>
        </div>
        <div class="b-deck-controls">
          <button type="button" data-action="previous-card" aria-label="Previous candidate">
            ←
          </button>
          <div class="b-dots" aria-hidden="true">
            ${
        candidates.map((_, index) =>
          `<span class="b-dot ${index === state.deckIndex ? "active" : ""}"></span>`
        ).join("")
      }
          </div>
          <button type="button" data-action="next-card" aria-label="Next candidate">
            →
          </button>
        </div>
      `;
    }

    function resultsB() {
      const selected = candidates[state.selectedCandidate];
      return `
        <button class="b-back" type="button" data-action="back">← Review candidates</button>
        <article class="b-resolved-head">
          <small>Match locked · Step 3 of 3</small>
          <h2>${selected.title}</h2>
          <p>${selected.author} · first published ${selected.year}</p>
        </article>
        <div class="b-timeline">
          ${
        titles.map((title) => `
            <article class="b-result">
              <small>${title.language} · ${title.level}</small>
              <h3>${title.title}</h3>
              <div class="b-source">
                <strong>${title.source}</strong><br>${title.detail}
              </div>
            </article>
          `).join("")
      }
        </div>
      `;
    }

    function renderB() {
      app.innerHTML = `
        <section class="variant-b">
          <header class="b-topbar">
            <div class="b-logo">
              <span class="b-logo-mark"></span>
              <span>Same Work</span>
            </div>
            <span class="b-progress">
              ${state.stage === "candidates" ? "02 / 03" : "03 / 03"}
            </span>
          </header>
          ${searchForm("b-search")}
          <p class="b-kicker">
            ${
        state.stage === "candidates"
          ? "One decision at a time"
          : "Published editions found"
      }
          </p>
          <h1>
            ${
        state.stage === "candidates"
          ? "Is this the book you mean?"
          : "Titles with a paper trail."
      }
          </h1>
          <p class="b-intro">
            ${
        state.stage === "candidates"
          ? "Swipe through plausible works. Details help you rule out look-alikes."
          : "Every title below is backed by a cataloged edition or consistent bibliographic evidence."
      }
          </p>
          ${state.stage === "candidates" ? deckCard() : resultsB()}
        </section>
      `;
    }

    function candidateC(candidate, index) {
      return `
        <button
          class="c-candidate"
          type="button"
          data-action="select-candidate"
          data-index="${index}"
        >
          <span class="c-index">${String(index + 1).padStart(2, "0")}</span>
          <span>
            <h2>${candidate.title}</h2>
            <p><strong>${candidate.author}</strong> · ${candidate.year} · ${candidate.type}</p>
            <p>${candidate.note}</p>
          </span>
          <span class="c-chevron">›</span>
        </button>
      `;
    }

    function resultsC() {
      const selected = candidates[state.selectedCandidate];
      return `
        <button class="c-back" type="button" data-action="back">← Candidate list</button>
        <div class="c-resolved">
          <span class="c-check">✓</span>
          <span>
            <small>Resolved written work</small>
            <h2>${selected.title}</h2>
            <p>${selected.author} · ${selected.year}</p>
          </span>
        </div>
        <p class="c-eyebrow">4 language groups</p>
        <h1>Attested titles</h1>
        <p class="c-intro">
          Recommended title first in each language. Open a row to inspect
          editions and identifiers.
        </p>
        <div class="c-filter-row">
          <button class="c-filter active" type="button">All languages</button>
          <button class="c-filter" type="button">Verified only</button>
        </div>
        <div>
          ${
        titles.map((title) => `
            <article class="c-language-row">
              <span class="c-lang-code">${title.code}</span>
              <span>
                <h3>${title.title}</h3>
                <p>${title.source}</p>
              </span>
              <span class="c-level ${title.level.toLowerCase()}">${title.level}</span>
            </article>
          `).join("")
      }
        </div>
        <div class="c-note">
          <span>ⓘ</span>
          <span>“Probable” means multiple records agree, but a direct edition link is missing.</span>
        </div>
      `;
    }

    function renderC() {
      const body = state.stage === "candidates"
        ? `
          <p class="c-eyebrow">Step 2 of 3 · 3 candidates</p>
          <h1>Confirm the written work</h1>
          <p class="c-intro">
            These records share your title or closely related catalog data.
          </p>
          <div class="c-filter-row">
            <button class="c-filter active" type="button">All candidates</button>
            <button class="c-filter" type="button">Novel</button>
            <button class="c-filter" type="button">By year</button>
          </div>
          <div class="c-candidates">
            ${candidates.map(candidateC).join("")}
          </div>
          <div class="c-note">
            <span>ⓘ</span>
            <span>We never silently choose a work from a title search—even when the first result looks strong.</span>
          </div>
        `
        : resultsC();

      app.innerHTML = `
        <section class="variant-c">
          <header class="c-header">
            <div class="c-nav">
              <div class="c-brand">
                <span class="c-brand-icon">Aa</span>
                <span>Title Atlas</span>
              </div>
              <button class="c-help" type="button" aria-label="Help">?</button>
            </div>
            ${searchForm("c-search")}
          </header>
          <div class="c-main">
            <div class="c-progress" aria-label="Lookup progress">
              <span class="done"></span>
              <span class="${
        state.stage === "candidates" ? "active" : "done"
      }"></span>
              <span class="${state.stage === "results" ? "active" : ""}"></span>
            </div>
            ${body}
          </div>
        </section>
      `;
    }

    function render() {
      const variant = currentVariant();
      variantName.textContent = variant.name;
      document.title = `${variant.name} — Book Title Lookup`;

      if (variant.key === "A") renderA();
      if (variant.key === "B") renderB();
      if (variant.key === "C") renderC();
    }

    function cycleVariant(direction) {
      const currentIndex = variants.findIndex(
        (variant) => variant.key === currentVariant().key,
      );
      const nextIndex = (currentIndex + direction + variants.length) %
        variants.length;
      const url = new URL(location.href);
      url.searchParams.set("variant", variants[nextIndex].key);
      history.replaceState(null, "", url);
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.querySelector("#previous-variant").addEventListener(
      "click",
      () => cycleVariant(-1),
    );
    document.querySelector("#next-variant").addEventListener(
      "click",
      () => cycleVariant(1),
    );

    document.addEventListener("keydown", (event) => {
      const target = event.target;
      const isEditing = target.matches("input, textarea, [contenteditable]");
      if (isEditing) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    app.addEventListener("submit", (event) => {
      const form = event.target.closest('[data-action="search"]');
      if (!form) return;
      event.preventDefault();
      state.query = new FormData(form).get("query").toString().trim() ||
        "百年孤独";
      state.stage = "candidates";
      state.deckIndex = 0;
      render();
    });

    app.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]");
      if (!action) return;

      if (action.dataset.action === "select-candidate") {
        state.selectedCandidate = Number(action.dataset.index);
        state.stage = "results";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      if (action.dataset.action === "back") {
        state.stage = "candidates";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      if (action.dataset.action === "previous-card") {
        state.deckIndex = (state.deckIndex - 1 + candidates.length) %
          candidates.length;
        render();
      }

      if (action.dataset.action === "next-card") {
        state.deckIndex = (state.deckIndex + 1) % candidates.length;
        render();
      }

      if (action.dataset.action === "toggle-evidence") {
        const detail = action.nextElementSibling;
        const expanded = action.getAttribute("aria-expanded") === "true";
        action.setAttribute("aria-expanded", String(!expanded));
        action.firstElementChild.textContent = expanded ? "＋" : "−";
        detail.hidden = expanded;
      }
    });

    window.addEventListener("popstate", render);
    render();
    </script>
  </body>
</html>
