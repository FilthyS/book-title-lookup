name: build

# Node.js is both the development and published runtime. This workflow builds
# one self-contained JavaScript package and exercises the tarball on every
# supported runner. It never publishes: there is no registry token, OIDC
# permission, protected environment, or `npm publish` step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: fmt / lint / check / test / package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run fmt:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build package
        run: npm run build
      - name: Inspect package contents
        run: npm run verify:package
      - name: Whitespace check
        run: git diff --check

  install-smoke:
    name: npm install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-15-intel
          - macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pack, install, and run the published CLI shape
        run: npm run smoke:install
