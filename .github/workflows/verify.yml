name: verify

# Post-build distribution gates (issue #37 / ticket #20 section 6.6;
# npm-release-topology.md sections 7 and 11). This workflow exercises the npm
# package trees, dry-run/tarball inspection, artifact-manifest consistency, and
# the launcher contract tests from a single host. A committed source dry-run
# uses the fixture stub platform packages (`--stubs`); real compiled binaries
# are produced and natively smoke-tested on matching runners by build.yml.
#
# Build-and-verify template only: it never publishes, holds no token, performs
# no OIDC, and references no protected environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: launcher contract + pack / manifest / verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Launcher contract tests
        run: deno task test:launcher

      # Compile the native (host) binary so the release-shaped package wave
      # carries one real compiled artifact plus committed stubs for the other
      # targets. This keeps the dry-run/tarball pipeline exercised from source
      # without cross-compiling all four targets on one runner.
      - name: Compile native target
        run: >-
          deno run --allow-run=deno --allow-read --allow-write
          distribution/scripts/compile.ts

      - name: Pack (dry-run, never publish)
        run: >-
          deno run --allow-env=BOOK_TITLE_RELEASE_VERSION --allow-run=npm,git
          --allow-read --allow-write
          distribution/scripts/pack.ts --dry-run --stubs

      - name: Generate artifact manifest
        run: >-
          deno run --allow-read --allow-write
          distribution/scripts/manifest.ts

      - name: Verify dry-run file lists / tarballs / manifest
        run: >-
          deno run --allow-run=npm --allow-read --allow-write
          distribution/scripts/verify.ts

      - name: Confirm no publish path is invoked
        shell: bash
        run: |
          # Match only real YAML command/env keys (anchored to a key name at the
          # start of a line). Comments and this guard's own text can no longer
          # self-trigger the check while genuine publish capability still fails it.
          if grep -R -n -E -e \
              '^[[:space:]]*(run|command)[[:space:]]*:[[:space:]]*npm publish([[:space:]]|$)' \
              -e '^[[:space:]]*NPM_TOKEN[[:space:]]*:' \
              -e '^[[:space:]]*publish[[:space:]]*:' \
              .github/workflows; then
            echo "a publish path leaked into the build templates" >&2
            exit 1
          fi
